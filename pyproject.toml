[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdrmerge"
version = "0.1.0"
description = "Merge bracketed exposures into an HDR photograph"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hunter McCoy" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    # 4.10.0.84 is the first release built against the numpy 2 ABI;
    # earlier ones fail to import entirely alongside numpy>=2.
    "opencv-python-headless>=4.10.0.84",
    # 9.3.0 is the first release with wheels for Python 3.11;
    # 9.0 has none and falls back to a source build that fails.
    "Pillow>=9.3",
    "exifread>=3.0",
    "rawpy>=0.18",
    "tifffile>=2022.5.4",
    # 3.3.0 introduced the OpenEXR.File API that writers.py uses; the 3.2
    # series ships only the legacy InputFile/OutputFile one.
    #
    # The marker matters: OpenEXR publishes wheels only up to cp313, so on 3.14
    # pip falls back to a source build needing CMake and a C++ toolchain, and
    # one optional output format takes the whole install down with it. Skipping
    # it there keeps hdrmerge installable; `pip install "hdrmerge[exr]"` adds it
    # back for anyone who has a toolchain, or once upstream ships wheels.
    "OpenEXR>=3.3; python_version < '3.14'",
]

[project.optional-dependencies]
# EXR output. Installed automatically wherever wheels exist (see the marker
# above); this extra is the explicit opt-in everywhere else.
exr = ["OpenEXR>=3.3"]
# The desktop GUI. PySide6 ships abi3 wheels covering Python 3.10-3.14, so this
# installs cleanly on every version the package supports.
gui = ["PySide6>=6.6"]
# piexif builds the synthetic EXIF-carrying brackets the tests merge. OpenEXR is
# deliberately absent: including it would make the dev install fail on 3.14 for
# exactly the reason the marker above exists. Tests that write EXR skip without it.
dev = ["pytest>=7.0", "piexif>=1.1.3"]

[project.urls]
Homepage = "https://github.com/hmccoy8/HDR_Merge"

[project.scripts]
hdrmerge = "hdrmerge.cli:main"

[project.gui-scripts]
hdrmerge-gui = "hdrmerge.gui.app:main"

[tool.setuptools.packages.find]
include = ["hdrmerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
