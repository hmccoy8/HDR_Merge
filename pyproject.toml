[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdrmerge"
version = "0.1.0"
description = "Merge bracketed exposures into an HDR photograph"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hunter McCoy" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    # 4.10.0.84 is the first release built against the numpy 2 ABI;
    # earlier ones fail to import entirely alongside numpy>=2.
    "opencv-python-headless>=4.10.0.84",
    # 9.3.0 is the first release with wheels for Python 3.11;
    # 9.0 has none and falls back to a source build that fails.
    "Pillow>=9.3",
    "exifread>=3.0",
    "rawpy>=0.18",
    "tifffile>=2022.5.4",
    # 3.3.0 introduced the OpenEXR.File API that writers.py uses;
    # the 3.2 series ships only the legacy InputFile/OutputFile one.
    "OpenEXR>=3.3",
]

[project.optional-dependencies]
# piexif builds the synthetic EXIF-carrying brackets the tests merge.
dev = ["pytest>=7.0", "piexif>=1.1.3"]

[project.urls]
Homepage = "https://github.com/hmccoy8/HDR_Merge"

[project.scripts]
hdrmerge = "hdrmerge.cli:main"

[tool.setuptools.packages.find]
include = ["hdrmerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
